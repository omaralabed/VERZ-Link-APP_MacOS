[package]
name = "verz-sim"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The method itself lives with the engine's other shared crates.
verz-bonding-core = { path = "../../Engine/vendor/verz-bonding-core" }
# The current shipped schedulers are compiled from UdpEngine's own source
# files (see main.rs), so the baselines are the real code, not imitations.
verz-link-core = { path = "../../Engine/vendor/verz-link-core" }
serde_json = "1"
