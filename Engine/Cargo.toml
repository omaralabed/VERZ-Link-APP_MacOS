[package]
name = "verz-link-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
verz-link-core = { path = "vendor/verz-link-core" }
anyhow = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
tun-rs = { version = "=2.8.8", features = ["async"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "process", "io-util", "io-std", "sync"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
